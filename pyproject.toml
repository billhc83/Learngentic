[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "learngentic"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "gitpython>=3.1.40",
    "mcp>=1.0.0",
    "click>=8.1.0",
    "requests>=2.32.0",
]

[project.scripts]
learngentic = "learngentic.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/learngentic"]
